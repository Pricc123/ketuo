name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project Ketuo.xcodeproj \
            -scheme Ketuo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -40

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Ketuo.app" Payload/
          zip -qry Ketuo-unsigned.ipa Payload
          ls -lh Ketuo-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ketuo-unsigned-ipa
          path: Ketuo-unsigned.ipa
